name: SGS - Testes e cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

    - name: Configurar Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.12'
    cache: pip
    cache-dependency-path: requirements-test.txt

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Executar testes unitários e de integração
        run: |
          mkdir -p evidence
          pytest -v --junitxml=evidence/junit-results.xml | tee evidence/test-run.txt

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgs-evidencias-testes
          path: evidence/
          if-no-files-found: warn
