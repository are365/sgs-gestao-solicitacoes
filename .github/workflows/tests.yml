name: SGS - Testes e cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Instalar dependencias de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Executar testes unitarios e de integracao
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          python -m pytest -v \
            --junitxml=evidence/junit-results.xml \
            2>&1 | tee evidence/test-run.txt

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgs-evidencias-testes
          path: evidence/
          if-no-files-found: warn
